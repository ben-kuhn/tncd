name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        # -count=1 disables the test cache: a cached pass can mask a flaky
        # test that only fails on some runs (e.g. map-iteration-order bugs).
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Repeat timing-sensitive packages
        # Ordering/timing bugs in the serialized core often need a second run
        # with a different map/schedule order to surface.
        run: CGO_ENABLED=0 go test -count=2 ./ax25/l2/ ./internal/bridge/ ./internal/engine/

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Cross-compile matrix
        run: |
          set -e
          for target in linux/amd64 linux/386 linux/arm64 linux/riscv64 \
                        windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /tmp/tncd ./cmd/tncd
            echo "ok: $target"
          done
          GOOS=linux GOARCH=arm GOARM=6 CGO_ENABLED=0 go build -o /tmp/tncd ./cmd/tncd
          echo "ok: linux/arm (GOARM=6)"

      # The generated corpus is cached across runs. That is not a speed
      # optimisation: on a COLD cache each target rediscovers its whole corpus
      # inside the 10s budget (FuzzParseModulo finds ~47 new inputs from its 6
      # seeds, reproduced locally with an empty GOCACHE), and every new input
      # triggers minimisation. When the deadline lands during that work the
      # coordinator reports "context deadline exceeded" and the step fails
      # with no crasher written -- which is what made this step flake twice,
      # both times on commits that changed no Go code. A warm corpus finds ~0
      # new inputs, so there is nothing to minimise at the boundary. It also
      # makes fuzzing cumulative instead of restarting from the seeds on every
      # push, which is strictly better coverage. Per-commit key with a prefix
      # restore, so each run seeds from the latest corpus and saves its own.
      - name: Fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      - name: Fuzz smoke (10s per parser target)
        run: |
          set -e
          # Keep this list in sync when adding a Fuzz* target: CLAUDE.md
          # promises CI fuzzes every untrusted-byte parser, and a target
          # missing here only ever replays its seed corpus under `go test`.
          for spec in "ax25 FuzzParseModulo" "ax25 FuzzParseXID" "ax25 FuzzParseAddress" \
                      "agwpe FuzzParseHeader" "kiss FuzzDecoderFeed" "kiss FuzzParseRFCOMMChannel"; do
            pkg="${spec% *}"; target="${spec#* }"
            # -fuzzminimizetime bounds the per-find minimisation that races the
            # deadline; without it one slow minimisation can overrun the step.
            CGO_ENABLED=0 go test -fuzz="$target" -fuzztime=10s -fuzzminimizetime=2s "./$pkg/"
          done

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
