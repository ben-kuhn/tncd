name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT go-version-file: go.mod. That directive is the language/minimum
      # version (1.25.13), and pinning CI to it meant every single commit --
      # including docs-only ones -- failed govulncheck on 8 Go *standard
      # library* CVEs that are only fixable by moving the toolchain
      # (GO-2026-6603/6607/6608/6609/6611/6612/6613/6617, all "Fixed in
      # go1.26.9"). Tracking stable keeps the stdlib patched as releases land
      # instead of requiring a go.mod bump every time one does -- and a newer
      # toolchain building an older `go` directive is normal and supported.
      # go.mod stays where it is so local builds are not forced to upgrade.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Unit tests
        # -count=1 disables the test cache: a cached pass can mask a flaky
        # test that only fails on some runs (e.g. map-iteration-order bugs).
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Repeat timing-sensitive packages
        # Ordering/timing bugs in the serialized core often need a second run
        # with a different map/schedule order to surface.
        run: CGO_ENABLED=0 go test -count=2 ./ax25/l2/ ./internal/bridge/ ./internal/engine/

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Cross-compile matrix
        run: |
          set -e
          for target in linux/amd64 linux/386 linux/arm64 linux/riscv64 \
                        windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /tmp/tncd ./cmd/tncd
            echo "ok: $target"
          done
          GOOS=linux GOARCH=arm GOARM=6 CGO_ENABLED=0 go build -o /tmp/tncd ./cmd/tncd
          echo "ok: linux/arm (GOARM=6)"

      # The generated corpus is cached across runs. That is not a speed
      # optimisation: on a COLD cache each target rediscovers its whole corpus
      # inside the 10s budget (FuzzParseModulo finds ~47 new inputs from its 6
      # seeds, reproduced locally with an empty GOCACHE), and every new input
      # triggers minimisation. When the deadline lands during that work the
      # coordinator reports "context deadline exceeded" and the step fails
      # with no crasher written -- which is what made this step flake twice,
      # both times on commits that changed no Go code. A warm corpus finds ~0
      # new inputs, so there is nothing to minimise at the boundary. It also
      # makes fuzzing cumulative instead of restarting from the seeds on every
      # push, which is strictly better coverage. Per-commit key with a prefix
      # restore, so each run seeds from the latest corpus and saves its own.
      - name: Fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      - name: Fuzz smoke (10s per parser target)
        run: |
          set -e
          # EVERY Fuzz* target in the tree. Keep this list in sync when adding
          # one: CLAUDE.md promises CI fuzzes every untrusted-byte parser, and
          # a target missing here only ever replays its seed corpus under
          # plain `go test` -- it is never actually fuzzed.
          for spec in "ax25 FuzzParseModulo" "ax25 FuzzParseXID" "ax25 FuzzParseAddress" \
                      "agwpe FuzzParseHeader" "kiss FuzzDecoderFeed" \
                      "kiss FuzzParseRFCOMMChannel" "kiss FuzzDemuxFeed" \
                      "benshi FuzzDecoder" "benshi FuzzDecodeMessage" \
                      "benshi FuzzParseRFCh" "benshi FuzzDecodeSettings" \
                      "internal/frontend/rigctl FuzzHandleLine"; do
            pkg="${spec% *}"; target="${spec#* }"
            corpus="./$pkg/testdata/fuzz/$target"
            before=$(ls -1 "$corpus" 2>/dev/null | wc -l)
            # -fuzzminimizetime bounds the per-find minimisation that races the
            # deadline; without it one slow minimisation can overrun the step.
            out=$(CGO_ENABLED=0 go test -fuzz="$target" -fuzztime=10s \
                    -fuzzminimizetime=2s "./$pkg/" 2>&1) && rc=0 || rc=$?
            echo "$out"
            # Not `[ ... ] && continue`: under `set -e` a false test makes the
            # AND-list return non-zero and aborts the whole step.
            if [ $rc -eq 0 ]; then continue; fi

            # A real finding writes a reproducer into testdata/fuzz/<target>/.
            # Treat that as fatal, always.
            after=$(ls -1 "$corpus" 2>/dev/null | wc -l)
            if [ "$after" -gt "$before" ]; then
              echo "::error::$target found a crasher; reproducer written to $corpus"
              exit 1
            fi

            # No reproducer. The known non-finding failure is the coordinator
            # being cancelled at the -fuzztime boundary while a worker is still
            # busy, which reports "context deadline exceeded" and has failed
            # commits that changed no Go code. Retry once: the deadline race is
            # random, so a genuine problem fails twice.
            if echo "$out" | grep -q "context deadline exceeded"; then
              echo "::warning::$target hit the fuzz deadline race with no crasher; retrying once"
              CGO_ENABLED=0 go test -fuzz="$target" -fuzztime=10s \
                -fuzzminimizetime=2s "./$pkg/" || {
                  echo "::error::$target failed twice"; exit 1; }
              continue
            fi

            echo "::error::$target failed (rc=$rc) with no crasher and no deadline race"
            exit 1
          done

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the test job: govulncheck reports standard-library
      # vulnerabilities against whichever toolchain runs it.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
