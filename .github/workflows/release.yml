name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build all packages on one runner ──────────────────────────────────────
  # Plain GOOS/GOARCH cross-compilation of the static (CGO_ENABLED=0) Go binary
  # for each target arch, then nfpm packages each into .deb and .rpm. This
  # replaces the old QEMU/Docker/fpm/Python matrix — no emulation, no vendored
  # Python deps, no python3 runtime dependency.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        # Strip the leading 'v' from the tag: v1.97-Beta → 1.97-Beta.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.46.3
          curl -sSfL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" \
            -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Cross-compile binaries and build packages
        run: |
          set -euo pipefail
          mkdir -p dist out

          LDFLAGS="-s -w -X github.com/ben-kuhn/tncd/v2/internal/version.Version=${VERSION}"

          # arch rows: <nfpm arch> <artifact label> <GOARCH> <GOARM (blank if n/a)>
          # nfpm's arch name drives both deb and rpm labels:
          #   amd64 → amd64 / x86_64      386   → i386  / i686
          #   arm64 → arm64 / aarch64     arm6  → armhf / armv6hl
          #   riscv64 → riscv64 / riscv64
          build_one() {
            local nfpm_arch="$1" label="$2" goarch="$3" goarm="${4:-}"
            echo "── building ${label} (GOARCH=${goarch} GOARM=${goarm:-none}) ──"
            env CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" GOARM="${goarm}" \
              go build -ldflags "${LDFLAGS}" -o dist/tncd ./cmd/tncd

            # Stage the systemd unit patched for packaged paths (binary at
            # /usr/bin, config at /etc; drop WorkingDirectory).
            sed \
              -e 's|ExecStart=.*tncd[^-].*|ExecStart=/usr/bin/tncd -c /etc/tncd.ini|' \
              -e '/^WorkingDirectory=/d' \
              tncd.service > dist/tncd.service

            VERSION="${VERSION}" ARCH="${nfpm_arch}" nfpm package -f nfpm.yaml -p deb -t out/
            VERSION="${VERSION}" ARCH="${nfpm_arch}" nfpm package -f nfpm.yaml -p rpm -t out/

            # Ship the raw static binary per arch for direct download.
            cp dist/tncd "out/tncd-linux-${label}"
          }

          build_one amd64   amd64   amd64
          build_one 386     i386    386
          build_one arm64   arm64   arm64
          build_one arm6    armhf   arm   6
          build_one riscv64 riscv64 riscv64

          echo "── artifacts ──"
          ls -la out/

      - name: Cross-compile Windows, macOS, and BSD binaries
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/ben-kuhn/tncd/v2/internal/version.Version=${VERSION}"

          # Windows: tncd.exe is the app, the service, and its own GUI installer.
          # The embedded manifest/version resource (cmd/tncd/*.syso) is picked up
          # automatically. Ship a .zip with the docs so double-click just works.
          for wa in amd64 arm64; do
            env CGO_ENABLED=0 GOOS=windows GOARCH="${wa}" \
              go build -ldflags "${LDFLAGS}" -o dist/tncd.exe ./cmd/tncd
            # -j junks paths so tncd.exe, README, and COPYING land at the zip root.
            zip -qj "out/tncd-${VERSION}-windows-${wa}.zip" dist/tncd.exe README.md COPYING
            rm -f dist/tncd.exe
          done

          # macOS + FreeBSD: static binaries as tarballs (no service integration;
          # run tncd -c tncd.ini or via a user-provided launchd/rc unit).
          tarball() { # <goos> <goarch> <label>
            env CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -ldflags "${LDFLAGS}" -o dist/tncd ./cmd/tncd
            tar -czf "out/tncd-${VERSION}-$3.tar.gz" -C dist tncd
            rm -f dist/tncd
          }
          tarball darwin  amd64 macos-amd64
          tarball darwin  arm64 macos-arm64
          tarball freebsd amd64 freebsd-amd64

          echo "── all artifacts ──"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            out/*.deb
            out/*.rpm
            out/tncd-linux-*
            out/*.zip
            out/*.tar.gz

  # ── Publish: GitHub Release (all tags) ────────────────────────────────────
  # Every tag (including betas) gets a GitHub Release with all artifacts. The
  # signed APT/RPM repos, the Cloudflare site (tncd.dev), and the AUR PKGBUILD
  # move to the Go line only at the first non-beta tag (v2.0.0) — see the
  # `publish-repos` job below, which is gated to non-beta tags so beta releases
  # never overwrite the stable 1.3.x public repos.
  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.deb
            out/*.rpm
            out/tncd-linux-*
            out/*.zip
            out/*.tar.gz
          generate_release_notes: true

  # ── Repo publish — Go line, GATED TO NON-BETA TAGS (v2.0.0+) ───────────────
  # Runs only for a stable tag (no "-Beta" suffix), i.e. from v2.0.0 onward, so
  # a beta tag never overwrites the public repos. At v2.0.0 this moves the public
  # distribution from the Python 1.3.x line to the Go build. It builds the repos
  # from the Go .deb/.rpm produced by the `build` job.
  #
  # It publishes:
  #   - Signed APT repository  (GPG_PRIVATE_KEY)
  #   - Signed RPM repository  (GPG_PRIVATE_KEY)
  #   - Cloudflare Pages / Workers site → tncd.dev  (CF_API_TOKEN, CF_ACCOUNT_ID)
  #   - AUR PKGBUILD version-bump commit to main
  #
  # NOTE (website.yml): its apt/rpm packages are still pinned to v1.3.2. Bump
  # that pin to the v2.0.0 tag at cutover so website/** pushes rebuild the repos
  # from the Go line too — until v2.0.0 exists, changing it would break the live
  # repos (the download would 404).
  publish-repos:
    if: ${{ !contains(github.ref_name, 'Beta') }}
    runs-on: ubuntu-latest
    needs: build
    environment: tncd_cloudflare

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkgs/

      - name: Install repo tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_FP=$(gpg --list-secret-keys --with-colons \
                     | awk -F: '/^fpr:/{print $10; exit}')
          echo "GPG_FP=$GPG_FP" >> "$GITHUB_ENV"
          gpg --armor --export "$GPG_FP" > pkgs/tncd.pub

      - name: Build APT repository
        run: |
          mkdir -p repo/apt/pool/main/t/tncd
          cp pkgs/*.deb repo/apt/pool/main/t/tncd/

          cd repo/apt
          for arch in amd64 i386 armhf arm64 riscv64; do
            mkdir -p "dists/stable/main/binary-${arch}"
            dpkg-scanpackages --arch "${arch}" pool/ \
              > "dists/stable/main/binary-${arch}/Packages"
            gzip -k "dists/stable/main/binary-${arch}/Packages"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=tncd \
            -o APT::FTPArchive::Release::Label=tncd \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 i386 armhf arm64 riscv64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

          gpg --default-key "$GPG_FP" --clearsign \
            --output dists/stable/InRelease dists/stable/Release
          gpg --default-key "$GPG_FP" --detach-sign --armor \
            --output dists/stable/Release.gpg dists/stable/Release
          cd "$GITHUB_WORKSPACE"

      - name: Build RPM repository
        run: |
          # NOTE (phase-4 re-enable): nfpm labels the arm rpm 'armv6hl' (not the
          # old fpm 'armhfp'). Update this arch list to armv6hl when restoring.
          for rpm_arch in x86_64 i686 armhfp aarch64 riscv64; do
            mkdir -p "repo/rpm/${rpm_arch}"
            # Copy RPMs for this arch (may be empty if build failed)
            find pkgs/ -name "*.${rpm_arch}.rpm" \
              -exec cp {} "repo/rpm/${rpm_arch}/" \;
            if ls "repo/rpm/${rpm_arch}/"*.rpm 1>/dev/null 2>&1; then
              createrepo_c "repo/rpm/${rpm_arch}"
              gpg --default-key "$GPG_FP" --detach-sign --armor \
                "repo/rpm/${rpm_arch}/repodata/repomd.xml"
            fi
          done

          cat > repo/rpm/tncd.repo << 'EOF'
          [tncd]
          name=tncd - AGWPE-to-KISS Translation Bridge
          baseurl=https://tncd.dev/rpm/$basearch
          enabled=1
          gpgcheck=1
          gpgkey=https://tncd.dev/tncd.pub
          EOF

      - name: Assemble site
        run: |
          cp pkgs/tncd.pub repo/tncd.pub
          cp -r website/. repo/

      - name: Commit PKGBUILD version bump to main
        run: |
          SHA256=$(curl -sL \
            "https://github.com/ben-kuhn/tncd/archive/v${VERSION}.tar.gz" \
            | sha256sum | cut -d' ' -f1)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('$SHA256')/" packaging/PKGBUILD
          git add packaging/PKGBUILD
          git diff --cached --quiet || \
            git commit -m "chore: bump PKGBUILD to $VERSION [skip ci]"
          git push origin main

      - name: Generate wrangler.toml
        run: |
          cat > wrangler.toml <<'EOF'
          name = "tncd"
          compatibility_date = "2025-04-01"
          [assets]
          directory = "./repo"
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
