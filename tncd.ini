# AGWPE-to-KISS Bridge Configuration
# Copy to /etc/tncd.ini or specify with -c

[server]
# AGWPE server listen address and port
listen_host = 0.0.0.0
listen_port = 8000
callsign = N0CALL

[client]
# KISS connection type: serial, tcp, or bluetooth
type = serial

# Serial TNC settings
device = /dev/ttyUSB0
serial_baudrate = 9600
# over-the-air baud rate (for T1/T2 timer calculation)
ota_baudrate = 1200
# parity = N     # N=none, O=odd, E=even, M=mark, S=space (default: N)
# stopbits = 1   # 1, 1.5, or 2 (default: 1)
# rtscts = false # hardware RTS/CTS flow control (default: false)

# KISS mode initialization (optional, for TNCs that need a command to enter KISS mode)
# init_string = INT KISS\r
# init_delay = 1.0

# TCP TNC settings (uncomment if using TCP)
# type = tcp
# host = localhost
# port = 8001

[kiss]
# KISS timing parameters (values in 10ms units)
# tx_delay = 40
# persistence = 63
# slot_time = 20
# tx_tail = 30
# full_duplex = 0

# Bluetooth TNC settings (uncomment to use Bluetooth instead of serial/TCP)
# Requires dbus-python and PyGObject (included in packaged installs).
# Pair and trust the TNC via bluetoothctl first.
# type = bluetooth
# bdaddr = AA:BB:CC:DD:EE:FF
# channel = 6              # optional, auto-detected via SDP if omitted
# reconnect = true         # auto-reconnect on connection loss (default: true)
# reconnect_delay = 5      # initial reconnect delay in seconds (default: 5)
# reconnect_max_delay = 60 # max reconnect delay in seconds (default: 60)
