# Read-only API OTA validation — Direwolf as the local TNC (KISS PTY), real radio.
# PAT (AGWPE) -> tncd -> Direwolf KISS PTY (/tmp/kisstnc) -> radio -> RF -> peer.
# Exercises /api/status, /api/connections, /api/events against a live AX.25 session.
#
# Run: ./tncd -c tncd-api-ota.ini   (build: CGO_ENABLED=0 go build -o tncd ./cmd/tncd)

[server]
listen_host = 127.0.0.1
listen_port = 8005
callsign = KU0HN

[client.0]
name = Direwolf PTY (local TNC)
type = serial
device = /tmp/kisstnc
ota_baudrate = 1200
ax25_version = 2.2
# Direwolf's PTY is already in KISS mode — no init_string; skip the exit byte.
send_kiss_exit = false

[kiss.0]
tx_delay = 40
persistence = 63
slot_time = 20
tx_tail = 30

# --- The feature under test: read-only monitoring API ---
[api]
enabled = true
listen_host = 127.0.0.1
listen_port = 8002
