<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tncd Blog</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --code-bg: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--accent);
      letter-spacing: -1px;
    }
    header p.tagline {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1.05rem;
    }
    header .badges { margin-top: 1rem; }
    header .badges a {
      display: inline-block;
      margin: 0.2rem;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    header .badges a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    main {
      max-width: 90%;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }
    main > p.lead {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .post {
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      background: var(--surface);
    }
    .post h2 {
      font-size: 1.2rem;
      margin: 0 0 0.4rem;
    }
    .post h2 a { color: var(--accent); }
    .post .date {
      color: var(--muted);
      font-size: 0.85rem;
      font-family: "SF Mono", "Fira Code", monospace;
      margin-bottom: 0.6rem;
    }
    .post .summary {
      color: var(--text);
      font-size: 0.95rem;
    }

    .status {
      color: var(--muted);
      font-style: italic;
      padding: 1rem 0;
    }
    .status.error {
      color: #f85149;
      font-style: normal;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <h1>tncd</h1>
  <p class="tagline">Blog</p>
  <div class="badges">
    <a href="/">Home</a>
    <a href="/docs.html">Documentation</a>
    <a href="/changelog.html">Changelog</a>
    <a href="https://github.com/ben-kuhn/tncd">GitHub</a>
    <a href="https://github.com/ben-kuhn/tncd/releases">Releases</a>
  </div>
</header>

<main>
  <p class="lead">
    Posts tagged <code>tncd</code> from
    <a href="https://ku0hn.radio/tags/tncd/">ku0hn.radio</a>.
  </p>

  <div id="posts" class="status">Loading posts&hellip;</div>
</main>

<footer>
  <p>tncd &mdash; <a href="https://github.com/ben-kuhn/tncd">github.com/ben-kuhn/tncd</a> &mdash; GPL-3.0</p>
</footer>

<script>
  (function () {
    var FEED = 'https://ku0hn.radio/tags/tncd/index.json';
    var container = document.getElementById('posts');

    fetch(FEED, { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var posts = (data && data.posts) || [];
        if (posts.length === 0) {
          container.className = 'status';
          container.textContent = 'No posts yet.';
          return;
        }
        container.className = '';
        container.innerHTML = '';
        posts.forEach(function (p) {
          var el = document.createElement('article');
          el.className = 'post';

          var h = document.createElement('h2');
          var a = document.createElement('a');
          a.href = p.url;
          a.textContent = p.title;
          h.appendChild(a);

          var d = document.createElement('div');
          d.className = 'date';
          d.textContent = p.date;

          var s = document.createElement('div');
          s.className = 'summary';
          s.textContent = p.summary || '';

          el.appendChild(h);
          el.appendChild(d);
          if (p.summary) el.appendChild(s);
          container.appendChild(el);
        });
      })
      .catch(function (err) {
        container.className = 'status error';
        container.textContent =
          'Could not load posts (' + err.message + '). ' +
          'See them directly at ku0hn.radio/tags/tncd/.';
      });
  })();
</script>

</body>
</html>
