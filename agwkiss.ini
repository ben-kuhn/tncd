# AGWPE-to-KISS Bridge Configuration
# Copy to /etc/agwkiss.ini or specify with -c

[server]
# AGWPE server listen address and port
listen_host = 0.0.0.0
listen_port = 8000
callsign = AGWPE

[client]
# KISS connection type: serial or tcp
type = serial

# Serial TNC settings
device = /dev/rfcomm0
baudrate = 9600

# KISS parameters (optional)
# tx_delay = 40
# persistence = 63
# slot_time = 20
# tx_tail = 30
# full_duplex = 0

# TCP TNC settings (uncomment if using TCP)
# type = tcp
# host = localhost
# port = 8001

[bluetooth]
# Bluetooth TNC settings - BTECH UV-PRO
enabled = true
bind_dev = /dev/rfcomm0
bdaddr = 38:D2:00:01:52:8F
channel = 1
mode = watch
retry_delay = 5
