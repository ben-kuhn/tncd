# AGWPE-to-KISS Bridge Configuration
# Copy to /etc/agwkiss.ini or specify with -c

[server]
# AGWPE server listen address and port
listen_host = 0.0.0.0
listen_port = 8000
callsign = N0CALL

[client]
# KISS connection type: serial or tcp
type = serial

# Serial TNC settings
device = /dev/ttyUSB0
baudrate = 9600

# KISS parameters (optional)
# tx_delay = 40
# persistence = 63
# slot_time = 20
# tx_tail = 30
# full_duplex = 0

# TCP TNC settings (uncomment if using TCP)
# type = tcp
# host = localhost
# port = 8001

[bluetooth]
# Bluetooth TNC settings
# Run agwkiss-rfcomm -c agwkiss.ini to manage the rfcomm connection.
enabled = false
bind_dev = /dev/rfcomm0
bdaddr = 00:00:00:00:00:00
channel = 1
mode = watch
retry_delay = 5
