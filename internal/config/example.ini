# AGWPE-to-KISS Bridge Configuration
# Copy to /etc/tncd.ini or specify with -c

[server]
# AGWPE server listen address and port
listen_host = 127.0.0.1
listen_port = 8000
callsign = N0CALL

# Each TNC is a numbered section: [client.0] = AGWPE port 0, [client.1] = port 1, etc.
# Add more [client.N] sections to use multiple TNCs simultaneously.

[client.0]
# KISS connection type: serial, tcp, or bluetooth
type = serial
# name = My TNC

# Serial TNC settings
device = /dev/ttyUSB0
serial_baudrate = 9600
# over-the-air baud rate (for T1/T2 timer calculation)
ota_baudrate = 1200
# parity = N
# stopbits = 1
# rtscts = false

# KISS mode initialization (optional, for TNCs that need a command to enter KISS mode)
# init_string = INT KISS\r
# init_delay = 1.0

# KISS exit on shutdown (default: enabled). tncd sends C0 FF C0 on close
# so TNCs with a host mode return to it. Disable for TNCs that misbehave
# on the exit byte.
# send_kiss_exit = true

# Optional command-mode string sent after the KISS exit. Used for TNCs
# that persist KISS state in NVRAM (e.g. PK-232MBX: "KISS OFF\r").
# host_exit_string =
# exit_delay = 1.0

# TCP TNC settings (uncomment if using TCP)
# type = tcp
# host = localhost
# port = 8001

# Bluetooth TNC settings (uncomment to use Bluetooth instead of serial/TCP)
# Requires dbus-python and PyGObject (included in packaged installs).
# Pair and trust the TNC via bluetoothctl first.
# type = bluetooth
# bdaddr = AA:BB:CC:DD:EE:FF
# channel = 6
# reconnect = true
# reconnect_delay = 5
# reconnect_max_delay = 60

# Per-port KISS timing parameters (values in 10ms units)
# Match the number to the client section: [kiss.0] for [client.0], etc.
[kiss.0]
# tx_delay = 40
# persistence = 63
# slot_time = 20
# tx_tail = 30
# full_duplex = 0

# Example second TNC (uncomment to use):
# [client.1]
# name = Bluetooth TNC
# type = bluetooth
# bdaddr = AA:BB:CC:DD:EE:FF
# ota_baudrate = 1200
